services:
  web-server:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/ksmif.org
      - ./dockerconfig/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  database:
    image: mariadb:latest
    ports:
      - "${DB_PORT}:3306"
    restart: always
    command: --default-time-zone='+07:00'
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      #MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      TZ: 'Asia/Jakarta'
    volumes:
      - ./dockerconfig/mariadb:/var/lib/mysql

  php:
    image: php:8.4-fpm
    build: ./dockerconfig
    volumes:
      - ./:/var/www/ksmif.org
      - ./dockerconfig/upload.ini:/usr/local/etc/php/conf.d/uploads.ini
    working_dir: /var/www/ksmif.org

  composer:
    image: composer:2.8
    volumes:
      - ./:/app
    command: composer install 
    stdin_open: true
    tty: true

  node:
    image: node:alpine
    volumes:
      - ./:/app
    working_dir: /app
    command: sh -c "npm install && npm run build"
    stdin_open: true
    tty: true
    ports:
      - "3000:3000"
      - "5173:5173"

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins_server
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - ./dockerconfig/jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins
      - ../:/host-project
    restart: unless-stopped